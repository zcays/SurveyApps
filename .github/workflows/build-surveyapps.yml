name: Build SurveyApps (artifacts only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
            target: mac
          - os: macos-15-intel
            arch: x64
            target: mac
          - os: windows-2025
            arch: x64
            target: win
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.3'
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.13'
          architecture: ${{ matrix.arch }}
      - run: python -m pip install -r requirements-build.txt
      - run: npm ci
      - run: node scripts/build_icons.cjs
      - run: python scripts/build_icon_formats.py
      - run: python scripts/build_backend.py
      - run: python -m unittest discover -s tests -p "test_*.py"
      - run: npx electron-builder --${{ matrix.target }} --${{ matrix.arch }} --publish never
      - run: node tests/backend-lifecycle.cjs
      - run: node tests/desktop.cjs --packaged
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SurveyApps-${{ matrix.target }}-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            test-results/**
          if-no-files-found: error
          retention-days: 14
